name: Build and Deploy (WordPress Webhook)

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - wp_content_updated
  workflow_dispatch:

env:
  PUBLIC_SITE_URL: https://lab-hair-design.com
  WORDPRESS_BASE_URL: https://lab-hair-design.com
  PUBLIC_WORDPRESS_BASE_URL: https://lab-hair-design.com

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Normalize FTP remote directory
        shell: bash
        run: |
          remote_dir="${{ secrets.CONOHA_FTP_REMOTE_DIR }}"
          remote_dir="${remote_dir%/}/"
          echo "REMOTE_DIR=$remote_dir" >> "$GITHUB_ENV"
          echo "REMOTE_DIR_PUBLIC=/public_html/" >> "$GITHUB_ENV"
          echo "REMOTE_DIR_ROOT=./" >> "$GITHUB_ENV"

          echo "Configured target: $remote_dir"
          echo "Fallback target: /public_html/"
          echo "Root target: ./"

      - name: Deploy dist via FTP (configured target)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CONOHA_FTP_HOST }}
          username: ${{ secrets.CONOHA_FTP_USERNAME }}
          password: ${{ secrets.CONOHA_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.CONOHA_FTP_PORT }}
          local-dir: ./dist/
          server-dir: ${{ env.REMOTE_DIR }}
          dangerous-clean-slate: false

      - name: Deploy dist via FTP (public_html fallback)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CONOHA_FTP_HOST }}
          username: ${{ secrets.CONOHA_FTP_USERNAME }}
          password: ${{ secrets.CONOHA_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.CONOHA_FTP_PORT }}
          local-dir: ./dist/
          server-dir: ${{ env.REMOTE_DIR_PUBLIC }}
          dangerous-clean-slate: false

      - name: Deploy dist via FTP (root fallback)
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CONOHA_FTP_HOST }}
          username: ${{ secrets.CONOHA_FTP_USERNAME }}
          password: ${{ secrets.CONOHA_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.CONOHA_FTP_PORT }}
          local-dir: ./dist/
          server-dir: ${{ env.REMOTE_DIR_ROOT }}
          dangerous-clean-slate: false
